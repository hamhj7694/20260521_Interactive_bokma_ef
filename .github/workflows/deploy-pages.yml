name: Deploy interactive demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: domain-ar-mvp/package-lock.json

      - name: Install dependencies
        working-directory: domain-ar-mvp
        run: npm ci

      - name: Build Vite site
        working-directory: domain-ar-mvp
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: domain-ar-mvp/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository for live smoke test
        uses: actions/checkout@v4

      - name: Set up Node.js for live smoke test
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public site and experience guide
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Checking public demo: $SITE_URL"
          page=$(curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors "$SITE_URL")
          echo "$page" | grep -q '손동작 체험 가이드'
          echo "$page" | grep -q 'reset-effect'
          echo "$page" | grep -q 'webcam'
          echo "Public homepage, experience guide, camera element and reset button found."

      - name: Install Chromium browser for interactive smoke test
        working-directory: domain-ar-mvp
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Verify live browser camera and reset controls
        working-directory: domain-ar-mvp
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-live-site.mjs
